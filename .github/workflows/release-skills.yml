name: Release Skills

on:
  push:
    tags:
      - 'antislop-v*'
      - 'antislop-audit-v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to release (e.g. antislop-v1.6.0)'
        required: true

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Resolve tag
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "TAG=${{ github.event.inputs.tag }}" >> "$GITHUB_ENV"
          else
            echo "TAG=${GITHUB_REF_NAME}" >> "$GITHUB_ENV"
          fi

      - name: Build zips
        run: |
          SUFFIX="${TAG#antislop-}"
          zip -r "antislop-${SUFFIX}.zip" antislop/
          zip -r "antislop-audit-${SUFFIX}.zip" antislop-audit/
          mkdir -p gemini && cp antislop/GEMINI.md antislop/gemini-extension.json gemini/
          zip -r "gemini-${SUFFIX}.zip" gemini/

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          files: |
            *.zip
          generate_release_notes: true

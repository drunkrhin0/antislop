name: Release Skills

on:
  push:
    tags:
      - 'antislop-v*'
      - 'antislop-audit-v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to release (e.g. antislop-v1.6.0)'
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Resolve tag
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "TAG=${{ github.event.inputs.tag }}" >> "$GITHUB_ENV"
          else
            echo "TAG=${GITHUB_REF_NAME}" >> "$GITHUB_ENV"
          fi

      - name: Build zips
        run: |
          SUFFIX="${TAG#antislop-}"
          # zip from inside the parent dir so SKILL.md lands in the archive's
          # top-level folder (antislop/SKILL.md). Zipping skills/antislop/ from
          # the repo root buries it a level deeper, and drag-and-drop installers
          # only look one level in.
          (cd skills && zip -r "../antislop-${SUFFIX}.zip" antislop/)
          (cd skills && zip -r "../antislop-audit-${SUFFIX}.zip" antislop-audit/)
          mkdir -p build/antislop && cp skills/antislop/GEMINI.md skills/antislop/gemini-extension.json build/antislop/
          (cd build && zip -r "../gemini-${SUFFIX}.zip" antislop/)

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          files: |
            *.zip
          generate_release_notes: true

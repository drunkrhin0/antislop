name: Release Skills

on:
  push:
    tags:
      - 'antislop-v*'
      - 'antislop-audit-v*'

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build zips
        run: |
          TAG="${GITHUB_REF_NAME}"
          SUFFIX="${TAG#antislop-}"
          zip -r "antislop-${SUFFIX}.zip" antislop/
          zip -r "antislop-audit-${SUFFIX}.zip" antislop-audit/
          mkdir -p gemini && cp antislop/GEMINI.md antislop/gemini-extension.json gemini/
          zip -r "gemini-${SUFFIX}.zip" gemini/

      - uses: softprops/action-gh-release@v2
        with:
          files: |
            *.zip
          generate_release_notes: true

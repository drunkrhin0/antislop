name: Create Release

on:
  push:
    tags:
      - 'antislop-v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd  # v5.0.1

      - name: Package
        run: |
          VERSION="${GITHUB_REF#refs/tags/antislop-v}"
          zip -r "antislop-${VERSION}.zip" antislop/
          zip -r "antislop-audit-${VERSION}.zip" antislop-audit/
          mkdir -p gemini
          cp antislop/GEMINI.md antislop/gemini-extension.json gemini/
          zip -r "gemini-${VERSION}.zip" gemini/

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          VERSION="${TAG#antislop-v}"
          gh release create "$TAG" \
            --title "antislop v${VERSION}" \
            --generate-notes \
            *.zip

name: Lint Skills

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate repository invariants
        run: python3 validate.py --skills-dir skills --expect-version 2.0.0

      - name: Check generated artifacts match registry
        run: python3 generate.py --check

      - name: Run test suite
        run: python3 -m unittest discover -s tests -v

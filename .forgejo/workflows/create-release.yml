name: Create Release

on:
  push:
    tags:
      - 'antislop-v*'
  workflow_dispatch:

jobs:
  release:
    runs-on: docker
    container:
      image: alpine:latest
    steps:
      - name: Setup
        run: apk add --no-cache curl zip git >/dev/null 2>&1

      - name: Create annotated tag and push
        env:
          RELEASE_TOKEN: ${{ secrets.RELEASE_TOKEN }}
        run: |
          set -eu
          TAG="${GITHUB_REF#refs/tags/}"
          VERSION="${TAG#antislop-v}"

          # Only act on lightweight tags (annotated ones already work)
          TAG_TYPE=$(git tag -l --format='%(objecttype)' "$TAG" 2>/dev/null || echo "unknown")
          if [ "$TAG_TYPE" != "commit" ]; then
            echo "Tag ${TAG} is already annotated (type: ${TAG_TYPE}), skipping"
            exit 0
          fi

          echo "Converting lightweight tag ${TAG} to annotated..."
          CLONE_URL="https://x-access-token:${RELEASE_TOKEN}@${GITHUB_SERVER_URL#https://}/${GITHUB_REPOSITORY}.git"
          git clone --depth 1 --branch "${TAG}" "${CLONE_URL}" .
          git tag -d "$TAG" 2>/dev/null || true
          git tag -a "$TAG" -m "antislop v${VERSION}"
          git push "${CLONE_URL}" "refs/tags/${TAG}:refs/tags/${TAG}" --force
          echo "Annotated tag ${TAG} pushed"

      - name: Build zips
        run: |
          VERSION="${GITHUB_REF#refs/tags/}"
          VERSION="${VERSION#antislop-v}"
          zip -r "antislop-${VERSION}.zip" antislop/ 2>/dev/null || true
          zip -r "antislop-audit-${VERSION}.zip" antislop-audit/ 2>/dev/null || true
          mkdir -p gemini && cp antislop/GEMINI.md antislop/gemini-extension.json gemini/ 2>/dev/null || true
          zip -r "gemini-${VERSION}.zip" gemini/ 2>/dev/null || true
          ls -la *.zip 2>/dev/null || true

      - name: Upload assets to release
        env:
          RELEASE_TOKEN: ${{ secrets.RELEASE_TOKEN }}
        run: |
          set -eu
          TAG="${GITHUB_REF#refs/tags/}"
          VERSION="${TAG#antislop-v}"
          API="${GITHUB_SERVER_URL}/api/v1"
          REPO="${GITHUB_REPOSITORY}"
          AUTH="Authorization: token ${RELEASE_TOKEN}"

          echo "Finding release for tag ${TAG}..."
          RELEASE_DATA=$(curl -s "${API}/repos/${REPO}/releases/tags/${TAG}" -H "${AUTH}")
          RELEASE_ID=$(echo "$RELEASE_DATA" | sed -n 's/.*"id": *\([0-9]*\).*/\1/p')

          if [ -z "${RELEASE_ID}" ]; then
            echo "No release found — creating one"
            BODY="antislop v${VERSION} — writing style, audit companion, and Gemini extension."
            printf '{"tag_name":"%s","name":"antislop v%s","body":"%s","draft":false,"prerelease":false}' \
              "${TAG}" "${VERSION}" "${BODY}" > /tmp/release.json
            RESPONSE=$(curl -s -X POST "${API}/repos/${REPO}/releases" \
              -H "${AUTH}" -H "Content-Type: application/json" \
              -d @/tmp/release.json -w "\n%{http_code}")
            HTTP_CODE=$(echo "$RESPONSE" | tail -1)
            RELEASE_ID=$(echo "$RESPONSE" | sed -n 's/.*"id": *\([0-9]*\).*/\1/p')
            if [ -z "${RELEASE_ID}" ] || [ "${HTTP_CODE}" -ge 400 ]; then
              echo "Failed to create release (HTTP ${HTTP_CODE})"
              echo "Response: ${RESPONSE}"
              exit 1
            fi
          else
            echo "Found existing release ${RELEASE_ID}"
          fi

          echo "Uploading assets..."
          for ZIP in antislop-${VERSION}.zip antislop-audit-${VERSION}.zip gemini-${VERSION}.zip; do
            [ -f "$ZIP" ] || continue
            STATUS=$(curl -s -X POST "${API}/repos/${REPO}/releases/${RELEASE_ID}/assets?name=${ZIP}" \
              -H "${AUTH}" -H "Content-Type: application/zip" \
              --data-binary "@${ZIP}" \
              -w "%{http_code}" -o /dev/null)
            echo "  ${ZIP}: ${STATUS}"
          done

          echo "Release antislop v${VERSION} complete"

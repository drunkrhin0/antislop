name: Lint Skills

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        env:
          EVENT_SHA: ${{ github.sha }}
        run: |
          if [[ ! "${EVENT_SHA}" =~ ^[0-9a-f]{40}$ ]]; then
            echo "Invalid checkout SHA" >&2
            exit 1
          fi
          git init -q .
          # This public repository can be fetched anonymously. The runner's
          # documented internal route is HTTP-only, so never attach a token or
          # askpass helper to this transport.
          git remote add origin \
            "http://192.168.1.62:3000/drunkrhin0/antislop.git"
          GIT_TERMINAL_PROMPT=0 git fetch --depth 1 origin "${EVENT_SHA}"
          git checkout FETCH_HEAD

      - name: Run combined propagation report
        run: bash check.sh

      - name: Validate repository invariants
        run: python3 tools/validate.py --skills-dir skills --expect-version-from rules.json

      - name: Check generated artifacts match registry
        run: python3 tools/generate.py --check

      - name: Run test suite
        run: python3 -m unittest discover -s tests -t . -v

      - name: Test release packaging end to end
        run: bash scripts/test-release-e2e.sh

      - name: Build portable plugin archive
        run: bash scripts/build-plugin-archive.sh dist

      - name: Upload portable plugin archive
        uses: actions/upload-artifact@v3
        with:
          name: antislop-plugin-${{ github.sha }}
          path: |
            dist/antislop-plugin-*.zip
            dist/antislop-plugin-*.zip.sha256
          retention-days: 30

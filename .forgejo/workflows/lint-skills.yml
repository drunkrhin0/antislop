name: Lint Skills

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        env:
          RELEASE_TOKEN: ${{ secrets.RELEASE_TOKEN }}
        run: |
          git clone --depth 1 \
            "http://x-access-token:${RELEASE_TOKEN}@192.168.1.62:3000/drunkrhin0/antislop.git" \
            .

      - name: Validate repository invariants
        run: python3 validate.py --skills-dir skills --expect-version 1.8.0

      - name: Check generated artifacts match registry
        run: python3 generate.py --check

      - name: Run test suite
        run: python3 -m unittest discover -s tests -v

name: Release Skills

on:
  push:
    branches: [main]
    paths:
      - 'skills/antislop/SKILL.md'
      - 'skills/generate-slop/SKILL.md'
    tags:
      - 'antislop-v*'
  # A manual dispatch is the explicit replacement operation. Normal pushes
  # never move an existing release tag.
  workflow_dispatch:

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Prepare git credentials
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ASKPASS=$(mktemp)
          printf '%s\n' \
            '#!/bin/bash' \
            'case "$1" in' \
            '  *Username*) printf "%s\\n" "x-access-token" ;;' \
            '  *Password*) printf "%s\\n" "${GITHUB_TOKEN}" ;;' \
            '  *) exit 1 ;;' \
            'esac' > "$ASKPASS"
          chmod 700 "$ASKPASS"
          echo "ASKPASS_PATH=${ASKPASS}" >> "$GITHUB_ENV"

      - name: Checkout
        env:
          EVENT_REF: ${{ github.ref }}
        run: |
          if [[ "${EVENT_REF}" == "refs/heads/main" ]]; then
            :
          elif [[ "${EVENT_REF}" =~ ^refs/tags/antislop-v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            :
          else
            echo "Invalid checkout ref: ${EVENT_REF}" >&2
            exit 1
          fi
          git init -q .
          # The repository is public. Use the runner's reachable internal route
          # anonymously, and reserve the HTTPS origin for authenticated writes.
          git remote add origin \
            "http://192.168.1.62:3000/drunkrhin0/antislop.git"
          GIT_TERMINAL_PROMPT=0 git fetch origin "${EVENT_REF}"
          git checkout -q FETCH_HEAD

      - name: Install PyYAML
        env:
          PYYAML_VERSION: '6.0.3'
        run: pip install --quiet --break-system-packages "pyyaml==${PYYAML_VERSION}"

      - name: Verify release candidate
        env:
          EVENT_REF: ${{ github.ref }}
          GITHUB_REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          GIT_TERMINAL_PROMPT=0 \
            git fetch origin refs/heads/main:refs/remotes/origin/main
          if ! git merge-base --is-ancestor HEAD refs/remotes/origin/main; then
            echo "Release candidate is not reachable from protected main" >&2
            exit 1
          fi
          CANONICAL_VERSION=$(python3 -c \
            'import json; print(json.load(open("rules.json"))["version"])')
          if [[ ! "${CANONICAL_VERSION}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid canonical version: ${CANONICAL_VERSION}" >&2
            exit 1
          fi
          if [[ "${EVENT_REF}" == refs/tags/* ]]; then
            EXPECTED_TAG="antislop-v${CANONICAL_VERSION}"
            if [[ "${GITHUB_REF_NAME}" != "${EXPECTED_TAG}" ]]; then
              echo "Release tag ${GITHUB_REF_NAME} does not match ${EXPECTED_TAG}" >&2
              exit 1
            fi
          fi
          python3 generate.py --check
          python3 validate.py --skills-dir skills --expect-version-from rules.json
          bash check.sh
          python3 -m unittest discover -s tests -v

      - name: Tag antislop
        if: startsWith(github.ref, 'refs/heads/main')
        env:
          REPLACE_EXISTING_TAG: ${{ github.event_name == 'workflow_dispatch' && 'true' || 'false' }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          FORGEJO_URL: ${{ vars.FORGEJO_URL }}
        run: |
          VERSION=$(python3 -c "
          import yaml
          lines = []
          in_fm = False
          for line in open('skills/antislop/SKILL.md'):
              if line.strip() == '---':
                  in_fm = not in_fm
                  continue
              if in_fm:
                  lines.append(line)
              elif lines:
                  break
          d = yaml.safe_load(''.join(lines)) or {}
          print((d.get('metadata') or {}).get('version', ''))
          ")
          if [ -z "$VERSION" ]; then
            echo "No version found, skipping"
            exit 0
          fi
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid antislop version: $VERSION" >&2
            exit 1
          fi
          TAG="antislop-v${VERSION}"
          case "${REPLACE_EXISTING_TAG:-false}" in
            true|false) ;;
            *) echo "replace_existing_tag must be true or false" >&2; exit 1 ;;
          esac
          if [ -z "${FORGEJO_URL:-}" ]; then
            # The runner cannot resolve the public hostname. Use only this exact
            # private Docker-network origin when the repository variable is unset.
            FORGEJO_URL="http://192.168.1.62:3000"
          else
            case "${FORGEJO_URL}" in
              https://*) ;;
              *) echo "FORGEJO_URL must be an HTTPS origin" >&2; exit 1 ;;
            esac
          fi
          TAG_EXISTS=false
          if GIT_TERMINAL_PROMPT=0 git ls-remote --exit-code origin "refs/tags/${TAG}" >/dev/null 2>&1; then
            TAG_EXISTS=true
          fi
          if [ "${TAG_EXISTS}" = "true" ] && [ "${REPLACE_EXISTING_TAG:-false}" != "true" ]; then
            echo "Tag ${TAG} already exists, skipping"
            exit 0
          fi
          git config user.name "CI"
          git config user.email "ci@antislop"
          git tag -a -f "${TAG}" -m "antislop ${VERSION}"
          if [ "${REPLACE_EXISTING_TAG:-false}" = "true" ]; then
            GIT_ASKPASS="$ASKPASS_PATH" GIT_TERMINAL_PROMPT=0 \
              git push --force "${FORGEJO_URL%/}/drunkrhin0/antislop.git" "${TAG}"
            echo "Replaced tag ${TAG}"
          else
            GIT_ASKPASS="$ASKPASS_PATH" GIT_TERMINAL_PROMPT=0 \
              git push "${FORGEJO_URL%/}/drunkrhin0/antislop.git" "${TAG}"
            echo "Created tag ${TAG}"
          fi

      - name: Resolve version from tag
        if: startsWith(github.ref, 'refs/tags/antislop-v')
        run: |
          TAG="${GITHUB_REF_NAME}"
          case "${TAG}" in
            *$'\n'*) echo "Invalid release tag (newline)" >&2; exit 1 ;;
          esac
          if [[ ! "${TAG}" =~ ^antislop-v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid release tag, must match antislop-vMAJOR.MINOR.PATCH: ${TAG}" >&2
            exit 1
          fi
          VERSION="${TAG#antislop-v}"
          echo "VERSION=${VERSION}" >> "$GITHUB_ENV"
          echo "TAG=${TAG}" >> "$GITHUB_ENV"
          echo "Resolved: tag=${TAG} version=${VERSION}"

      - name: Build release assets
        if: startsWith(github.ref, 'refs/tags/antislop-v')
        run: |
          # zip from inside the parent dir so SKILL.md lands in the archive's
          # top-level folder (antislop/SKILL.md). Zipping skills/antislop/ from
          # the repo root buries it a level deeper, and drag-and-drop installers
          # only look one level in.
          (cd skills && zip -r "../antislop-${VERSION}.zip" antislop/)
          (cd powers/antislop && zip -r "../../antislop-kiro-${VERSION}.zip" .)
          bash scripts/build-plugin-archive.sh .
          ls -la *.zip

      - name: Create release and upload assets
        if: startsWith(github.ref, 'refs/tags/antislop-v')
        env:
          RELEASE_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          FORGEJO_URL: ${{ vars.FORGEJO_URL }}
        run: |
          set -eu
          if [ -z "${FORGEJO_URL:-}" ]; then
            # The runner cannot resolve the public hostname. Use only this exact
            # private Docker-network origin when the repository variable is unset.
            FORGEJO_URL="http://192.168.1.62:3000"
          else
            case "${FORGEJO_URL}" in
              https://*) ;;
              *) echo "FORGEJO_URL must be an HTTPS origin" >&2; exit 1 ;;
            esac
          fi
          API="${FORGEJO_URL%/}/api/v1"
          # Hardcode the repo path: on this runner GITHUB_REPOSITORY is a full
          # ssh:// URL, not owner/repo, so interpolation would corrupt the API URL.
          REPO="drunkrhin0/antislop"

          extract_id() {
            # Reads a JSON object from argv[1] and prints its top-level "id",
            # or nothing. A naive sed/grep for "id": matches the *last*
            # occurrence in the blob, which is the author's user id (nested
            # under "author"), not the release's own id -- silently uploads
            # assets to the wrong (often nonexistent) release. Parse it.
            python3 -c "
          import json, sys
          try:
              print(json.loads(sys.argv[1]).get('id', ''))
          except Exception:
              print('')
          " "$1"
          }

          echo "Finding release for tag ${TAG}..."
          LOOKUP=$(curl --silent --show-error -w "\n%{http_code}" \
            "${API}/repos/${REPO}/releases/tags/${TAG}" \
            -K <(printf 'header = "Authorization: token %s"\n' "$RELEASE_TOKEN"))
          LOOKUP_CODE=$(printf '%s' "$LOOKUP" | tail -n1)
          LOOKUP_BODY=$(printf '%s' "$LOOKUP" | sed '$d')
          RELEASE_ID=""
          if [ "${LOOKUP_CODE}" = "200" ]; then
            RELEASE_ID=$(extract_id "$LOOKUP_BODY")
            if [ -z "${RELEASE_ID}" ]; then
              echo "Release lookup returned no release id" >&2
              exit 1
            fi
            echo "Found existing release ${RELEASE_ID}"
          elif [ "${LOOKUP_CODE}" = "404" ]; then
            echo "No release found, creating one"
            NOTES_FILE="docs/release-notes-${VERSION}.md"
            python3 scripts/build-release-json.py \
              "${TAG}" "${VERSION}" "${NOTES_FILE}" > /tmp/release.json
            RESPONSE=$(curl --silent --show-error --fail-with-body \
              -w "\n%{http_code}" -X POST "${API}/repos/${REPO}/releases" \
              -K <(printf 'header = "Authorization: token %s"\n' "$RELEASE_TOKEN") \
              -H "Content-Type: application/json" \
              -d @/tmp/release.json)
            HTTP_CODE=$(printf '%s' "$RESPONSE" | tail -n1)
            RESPONSE_BODY=$(printf '%s' "$RESPONSE" | sed '$d')
            RELEASE_ID=$(extract_id "$RESPONSE_BODY")
            if [ -z "${RELEASE_ID}" ] || [ "${HTTP_CODE}" -ge 400 ]; then
              echo "Failed to create release (HTTP ${HTTP_CODE})"
              echo "Response: ${RESPONSE_BODY}"
              exit 1
            fi
          else
            echo "Release lookup failed (HTTP ${LOOKUP_CODE})" >&2
            echo "Response: ${LOOKUP_BODY}" >&2
            exit 1
          fi

          echo "Uploading assets..."
          for ZIP in antislop-${VERSION}.zip antislop-plugin-${VERSION}.zip antislop-kiro-${VERSION}.zip; do
            if [ ! -f "$ZIP" ]; then
              echo "Missing release asset: ${ZIP}" >&2
              exit 1
            fi
            curl --silent --show-error --fail-with-body \
              -X POST "${API}/repos/${REPO}/releases/${RELEASE_ID}/assets?name=${ZIP}" \
              -K <(printf 'header = "Authorization: token %s"\n' "$RELEASE_TOKEN") \
              -H "Content-Type: application/zip" \
              --data-binary "@${ZIP}" \
              -o /dev/null
            echo "  ${ZIP}: uploaded"
          done

          echo "Release antislop v${VERSION} complete"

      - name: Remove git credentials
        if: always()
        run: |
          if [ -n "${ASKPASS_PATH:-}" ]; then
            rm -f "${ASKPASS_PATH}"
          fi

name: Release Skills

on:
  push:
    branches: [main]
    paths:
      - 'skills/antislop/SKILL.md'
      - 'skills/antislop-audit/SKILL.md'
    tags:
      - 'antislop-v*'
      - 'antislop-audit-v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Tag antislop
        if: startsWith(github.ref, 'refs/heads/main')
        run: |
          VERSION=$(python3 -c "
          import yaml
          lines = []
          in_fm = False
          for line in open('skills/antislop/SKILL.md'):
              if line.strip() == '---':
                  in_fm = not in_fm
                  continue
              if in_fm:
                  lines.append(line)
              elif lines:
                  break
          d = yaml.safe_load(''.join(lines)) or {}
          print((d.get('metadata') or {}).get('version', ''))
          " 2>/dev/null || echo "")
          if [ -z "$VERSION" ]; then
            echo "No version found, skipping"
            exit 0
          fi
          TAG="antislop-v${VERSION}"
          if git rev-parse "${TAG}" >/dev/null 2>&1; then
            echo "Tag ${TAG} already exists, skipping"
          else
            git config user.name "CI"
            git config user.email "ci@antislop"
            git tag -a "${TAG}" -m "antislop ${VERSION}"
            git push origin "${TAG}"
            echo "Created tag ${TAG}"
          fi

      - name: Tag antislop-audit
        if: startsWith(github.ref, 'refs/heads/main')
        run: |
          VERSION=$(python3 -c "
          import yaml
          lines = []
          in_fm = False
          for line in open('skills/antislop-audit/SKILL.md'):
              if line.strip() == '---':
                  in_fm = not in_fm
                  continue
              if in_fm:
                  lines.append(line)
              elif lines:
                  break
          d = yaml.safe_load(''.join(lines)) or {}
          print((d.get('metadata') or {}).get('version', ''))
          " 2>/dev/null || echo "")
          if [ -z "$VERSION" ]; then
            echo "No version found, skipping"
            exit 0
          fi
          TAG="antislop-audit-v${VERSION}"
          if git rev-parse "${TAG}" >/dev/null 2>&1; then
            echo "Tag ${TAG} already exists, skipping"
          else
            git config user.name "CI"
            git config user.email "ci@antislop"
            git tag -a "${TAG}" -m "antislop-audit ${VERSION}"
            git push origin "${TAG}"
            echo "Created tag ${TAG}"
          fi

      - name: Resolve version from tag
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          TAG="${GITHUB_REF_NAME}"
          VERSION="${TAG#antislop-v}"
          if [ "$VERSION" = "$TAG" ]; then
            VERSION="${TAG#antislop-audit-v}"
          fi
          echo "VERSION=${VERSION}" >> "$GITHUB_ENV"
          echo "TAG=${TAG}" >> "$GITHUB_ENV"
          echo "Resolved: tag=${TAG} version=${VERSION}"

      - name: Build zips
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          zip -r "antislop-${VERSION}.zip" skills/antislop/
          zip -r "antislop-audit-${VERSION}.zip" skills/antislop-audit/
          mkdir -p gemini && cp skills/antislop/GEMINI.md skills/antislop/gemini-extension.json gemini/
          zip -r "gemini-${VERSION}.zip" gemini/
          ls -la *.zip

      - name: Create release and upload assets
        if: startsWith(github.ref, 'refs/tags/')
        env:
          RELEASE_TOKEN: ${{ secrets.RELEASE_TOKEN }}
        run: |
          set -eu
          API="http://192.168.1.62:3000/api/v1"
          REPO="${GITHUB_REPOSITORY}"
          AUTH="Authorization: token ${RELEASE_TOKEN}"

          echo "Finding release for tag ${TAG}..."
          RELEASE_DATA=$(curl -s "${API}/repos/${REPO}/releases/tags/${TAG}" -H "${AUTH}")
          RELEASE_ID=$(echo "$RELEASE_DATA" | sed -n 's/.*"id": *\([0-9]*\).*/\1/p')

          if [ -z "${RELEASE_ID}" ]; then
            echo "No release found — creating one"
            BODY="antislop v${VERSION} — writing style, audit companion, Gemini extension, and opencode agent."
            printf '{"tag_name":"%s","name":"antislop v%s","body":"%s","draft":false,"prerelease":false}' \
              "${TAG}" "${VERSION}" "${BODY}" > /tmp/release.json
            RESPONSE=$(curl -s -X POST "${API}/repos/${REPO}/releases" \
              -H "${AUTH}" -H "Content-Type: application/json" \
              -d @/tmp/release.json -w "\n%{http_code}")
            HTTP_CODE=$(echo "$RESPONSE" | tail -1)
            RELEASE_ID=$(echo "$RESPONSE" | sed -n 's/.*"id": *\([0-9]*\).*/\1/p')
            if [ -z "${RELEASE_ID}" ] || [ "${HTTP_CODE}" -ge 400 ]; then
              echo "Failed to create release (HTTP ${HTTP_CODE})"
              echo "Response: ${RESPONSE}"
              exit 1
            fi
          else
            echo "Found existing release ${RELEASE_ID}"
          fi

          echo "Uploading assets..."
          for ZIP in antislop-${VERSION}.zip antislop-audit-${VERSION}.zip gemini-${VERSION}.zip; do
            [ -f "$ZIP" ] || continue
            STATUS=$(curl -s -X POST "${API}/repos/${REPO}/releases/${RELEASE_ID}/assets?name=${ZIP}" \
              -H "${AUTH}" -H "Content-Type: application/zip" \
              --data-binary "@${ZIP}" \
              -w "%{http_code}" -o /dev/null)
            echo "  ${ZIP}: ${STATUS}"
          done

          echo "Release antislop v${VERSION} complete"
